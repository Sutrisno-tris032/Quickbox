[dev-dependencies]
quickbox-core = { workspace = true }
quickbox-smtp = { workspace = true }
quickbox-api = { workspace = true }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.17"
serde_json = { workspace = true }
